# 📄 Dosya Yolu: /turkuazvm/Cargo.toml
# 📌 Amac: TurkuazVM Rust workspace paketlerini ve ortak derleme ayarlarini tanimlar
# 📌 Modul - TOML
# Version: 0.41.2
# Aciklama: v0.41.2 Baglanti Merkezi calisan-VM erisim yamasini workspace surumunde toplar; v0.41.1 kullanilabilirlik ve v0.40.14 runtime duzeltmelerini korur
# Bagimli Oldugu Katman: Controller | Service | Repo | Tool | View

[workspace]
members = [
  "crates/artifact-cache",
    "apps/engine",
    "apps/desktop/src-tauri",
    "apps/display",
    "crates/core",
    "crates/android",
    "crates/android-image",
    "crates/gpu",
    "crates/gaming-input",
    "crates/game-catalog",
    "crates/guest-catalog",
    "crates/guest-agent-protocol",
    "crates/engine-api",
    "crates/qemu",
    "crates/guest",
    "crates/platform",
    "crates/repositories",
    "crates/storage",
    "crates/transport",
]
resolver = "3"

[workspace.package]
version = "0.41.2"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
authors = ["TurkuazVM"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
serde_yaml_ng = "0.10"
fs2 = "0.4"
ed25519-dalek = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
