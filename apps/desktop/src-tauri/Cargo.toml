[package]
name = "turkuazvm-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tauri = { version = "=2.11.5", features = ["config-json5"] }
turkuazvm-engine-api = { path = "../../../crates/engine-api" }
turkuazvm-transport = { path = "../../../crates/transport" }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = ["config-json5"] }

[lints]
workspace = true
