# 📄 Dosya Yolu: /turkuazvm/docs/examples/android.yml
# 📌 Amac: VM-bazli Android Runtime profile manifest ornegini gosterir
# 📌 Modul - YAML
# Version: 0.28.0
# Aciklama: android.yml schema version 1 ADB endpoint ve display profilini ornekler
# Bagimli Oldugu Katman: Repo

schema_version: 1
vm_id: android-dev
adb:
  host_ip: 127.0.0.1
  host_port: 5600
  guest_port: 5555
display:
  width: 1920
  height: 1080
  density_dpi: 320
  target_fps: 60
