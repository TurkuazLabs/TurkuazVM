# Dosya Yolu: /turkuazvm/.github/workflows/release-publish.yml
# Amac: main uzerindeki surum metadata'sindan GitHub tag ve Release olusturur, Windows dagitim workflow'unu tag ref'inde baslatir
# Modul - YAML
# Version: 0.41.4
# Aciklama: Workspace surumunu okuyup v<surum> tag'ini ve RELEASE_NOTES_v<surum>.md tabanli GitHub Release'i idempotent yayinlar; eksik Windows assetleri icin workflow_dispatch kullanir
# Bagimli Oldugu Katman: Tool | CI/CD

name: TurkuazVM Release Publisher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "RELEASE_NOTES_v*.md"
      - "RELEASE_STATUS_v*.yml"
      - "Cargo.toml"
      - "apps/desktop/src-tauri/tauri.conf.json5"
      - ".github/workflows/release-publish.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: turkuazvm-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          print(data["workspace"]["package"]["version"])
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "RELEASE_NOTES_v${VERSION}.md"
          test -f "RELEASE_STATUS_v${VERSION}.yml"
          grep -Fq "version = \"${VERSION}\"" Cargo.toml
          grep -Fq "\"version\": \"${VERSION}\"" apps/desktop/src-tauri/tauri.conf.json5

      - name: Create release tag when missing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "$GITHUB_SHA" -m "TurkuazVM ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create or keep GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release already exists: ${TAG}"
            exit 0
          fi
          gh release create "${TAG}" \
            --title "TurkuazVM ${TAG}" \
            --notes-file "RELEASE_NOTES_v${VERSION}.md" \
            --verify-tag

      - name: Dispatch Windows release distribution when assets are missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          setup="TurkuazVM-${VERSION}-x64-Setup.exe"
          portable="TurkuazVM-${VERSION}-x64-Portable.zip"
          hashes="TurkuazVM-${VERSION}-SHA256SUMS.txt"
          asset_names="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"

          missing=0
          for expected in "${setup}" "${portable}" "${hashes}"; do
            if ! grep -Fxq "${expected}" <<<"${asset_names}"; then
              echo "Missing release asset: ${expected}"
              missing=1
            fi
          done

          if [[ "${missing}" -eq 0 ]]; then
            echo "Windows release assets already exist for ${TAG}"
            exit 0
          fi

          echo "Dispatching Windows Distribution on ${TAG}"
          gh workflow run windows-distribution.yml --ref "${TAG}"
