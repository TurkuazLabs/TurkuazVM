# 📄 Dosya Yolu: /turkuazvm/.github/workflows/runtime-validation-gate.yml
# 📌 Amac: L runtime validation harness'i Linux ve Windows uzerinde gercek QEMU smoke testiyle calistirir
# 📌 Modul - YAML
# Version: 0.28.1
# Aciklama: qemu-img ve qemu-system kurup static gate, regression ve real control-plane evidence artifactlerini required check olarak uretir
# Bagimli Oldugu Katman: Tool | View

name: TurkuazVM Runtime Validation Gate

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-validation:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python validation dependency
        run: python -m pip install --disable-pip-version-check -r config/requirements-runtime-validation.txt
      - name: Prepare runtime dependencies on Linux
        if: runner.os == 'Linux'
        run: python tools/ci_system_dependency_tool.py --profile runtime-linux
      - name: Prepare runtime dependencies on Windows
        if: runner.os == 'Windows'
        run: python tools/ci_system_dependency_tool.py --profile runtime-windows
      - name: Validate L static gate
        run: python scripts/runtime_validation_gate.py
      - name: Run L regression groups
        run: python scripts/tests/test_runtime_validation_harness.py
      - name: Run real QEMU harness smoke
        run: python scripts/runtime_validation_run.py --mode smoke
      - name: Compile Python layers
        run: python -m compileall -q controllers services repositories tools views scripts
      - name: Upload L runtime validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-${{ runner.os }}
          path: artifacts/runtime-validation/
          if-no-files-found: error
          retention-days: 14
