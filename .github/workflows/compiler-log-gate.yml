# 📄 Dosya Yolu: /turkuazvm/.github/workflows/compiler-log-gate.yml
# 📌 Amac: Config kaynakli Windows/Linux Cargo compiler evidence zincirini calistirir ve sifir-hata gate uygular
# 📌 Modul - YAML
# Version: 0.28.0
# Aciklama: Matrix, toolchain ve retention configden uretilir; artifact eksikliginde aggregate gate yine structured BLOCKED sonucu yazar
# Bagimli Oldugu Katman: Tool | View

name: TurkuazVM Compiler Log Gate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
      retention_days: ${{ steps.export.outputs.retention_days }}
      rust_toolchain: ${{ steps.export.outputs.rust_toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI policy dependency
        run: python -m pip install --disable-pip-version-check -r config/requirements-ci.txt
      - name: Validate and export compiler policy
        id: export
        run: python scripts/compiler_gate_policy.py github-outputs

  collect:
    needs: policy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI policy dependency
        run: python -m pip install --disable-pip-version-check -r config/requirements-ci.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.policy.outputs.rust_toolchain }}
      - name: Collect Cargo JSON evidence
        if: always()
        run: python scripts/compiler_log_collect.py --platform "${{ matrix.platform }}"
      - name: Normalize compiler evidence
        if: always()
        run: python scripts/compiler_log_normalize.py --platform "${{ matrix.platform }}"
      - name: Upload compiler artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.platform }}
          path: |
            artifacts/compiler/${{ matrix.platform }}/
            artifacts/compiler-normalized/${{ matrix.platform }}/
          retention-days: ${{ fromJSON(needs.policy.outputs.retention_days) }}

  gate:
    needs: [policy, collect]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI policy dependency
        run: python -m pip install --disable-pip-version-check -r config/requirements-ci.txt
      - name: Download available compiler artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: compiler-*
          path: downloaded-compiler
      - name: Stage available normalized artifacts
        if: always()
        run: python scripts/compiler_artifact_stage.py
      - name: Zero compiler error and evidence-integrity gate
        if: always()
        run: >-
          python scripts/compiler_error_gate.py
          --expected-git-head "${{ github.sha }}"
          --policy-job-result "${{ needs.policy.result }}"
          --collect-job-result "${{ needs.collect.result }}"
      - name: Upload merged compiler summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-gate-summary
          path: artifacts/compiler-gate-summary.json
          retention-days: ${{ fromJSON(needs.policy.outputs.retention_days || '14') }}
