# Aciklama: Schema16/API17, transactional cache, secure HTTP, APK cert trust, ACL ve rollback invariantlarini required-check olarak dogrular
# Bagimli Oldugu Katman: Tool | View

name: artifact-cache-agent-gate

on:
  push:
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate dependencies
        run: python -m pip install -r config/requirements-ci.txt
      - name: Run Artifact Cache and Agent gate
        run: python scripts/artifact_cache_agent_gate.py
      - name: Run regression
        run: python scripts/tests/test_artifact_cache_agent.py
      - name: Validate mutable HTTP revalidation
        run: python scripts/tests/test_artifact_cache_http_revalidation.py
      - name: Validate v0.21 transactional HTTP contract
        run: python scripts/tests/test_artifact_cache_v21_contract.py
