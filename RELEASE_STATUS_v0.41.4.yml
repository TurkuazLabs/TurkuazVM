# 📄 Dosya Yolu: /turkuazvm/RELEASE_STATUS_v0.41.4.yml
# 📌 Amac: TurkuazVM v0.41.4 Windows dagitim patch adayinin durumunu kaydeder
# 📌 Modul - YAML
# Version: 0.41.4
# Aciklama: NSIS/portable paketleme, packaged runtime kok sabitlemesi ve Windows compiler-stage ayrimini release metadata olarak toplar
# Bagimli Oldugu Katman: View | Controller | Service | Repo | Tool | Config | CI/CD

version: 0.41.4
package: TurkuazVM-v0.41.4-WINDOWS-DISTRIBUTION
package_kind: WINDOWS_NSIS_PORTABLE_DISTRIBUTION_PATCH
base: TurkuazVM-v0.41.3
artifacts:
  windows_setup: TurkuazVM-0.41.4-x64-Setup.exe
  windows_portable: TurkuazVM-0.41.4-x64-Portable.zip
  sha256_manifest: TurkuazVM-0.41.4-SHA256SUMS.txt
compatibility:
  config_schema: 22
  download_sources_schema: 5
  engine_api_version: 24
  vm_manifest_schema: 6
  guest_catalog_schema: 4
  android_image_manifest_schema: 4
  guest_agent_protocol_version: 2
  breaking_change: false
focus:
- Windows Tauri release build produces a current-user NSIS installer
- Portable ZIP packages Desktop, Engine, Display and runtime config together
- Packaged Desktop anchors relative runtime paths to the executable directory when sibling config exists
- Distribution debug binary paths are rewritten to packaged bin executables
- Tauri stage resources are injected only during package build and no longer break ordinary cargo check
- SHA-256 manifest is generated for Setup and Portable artifacts
- v-tag workflow uploads Windows artifacts to GitHub Release Assets
constraints:
- QEMU is not bundled in the installer and must remain available through the existing dependency/runtime layer
- system-wide Program Files install mode remains disabled until writable runtime data is separated into AppData
preserved:
- v0.41.3 Windows/Linux Cargo and QEMU CI hardening
- v0.41.2 Connection Center running-VM SSH/RDP prepare behavior
- v0.41.1 VM workspace usability patch
- v0.41.0 VM control-first workspace
validation:
  windows_distribution_contract: PASS
  compiler_linux_workspace: PASS_ON_PRE_BUMP_HEAD
  compiler_windows_workspace: PASS_ON_PRE_BUMP_HEAD
  compiler_zero_error_gate: PASS_ON_PRE_BUMP_HEAD
  runtime_validation: PASS_ON_PRE_BUMP_HEAD
  host_resilience_policy: PASS_ON_PRE_BUMP_HEAD
  host_resilience_runtime: PASS_ON_PRE_BUMP_HEAD
  artifact_cache_agent: PASS_ON_PRE_BUMP_HEAD
  windows_distribution_real_nsis: PASS_ON_PRE_BUMP_HEAD
  release_v0414_final_pr_ci: REQUIRED_BEFORE_MERGE
  release_v0414_release_assets: REQUIRED_AFTER_TAG
release_gate: FINAL_PR_CI_REQUIRED
production_claim: false
